# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

AllCops:
  Exclude:
    # Migrations copied in by the Solidus installers; keep them identical to upstream.
    # Engine migrations are named <timestamp>_<name>.<engine>.rb.
    - "db/migrate/*.*.rb"
